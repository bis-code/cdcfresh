name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./... && go vet -tags=integration ./...
      - name: unit tier
        run: go test ./...
      # go.mod legitimately carries dependencies for the adapters and the test
      # environment; the invariant is that the ROOT package still links none of
      # them. Checking go.mod would pass while the real rule was broken.
      - name: root package stays stdlib-only
        run: |
          deps=$(go list -deps . | grep -v '^github.com/bis-code/cdcfresh' | grep '\.' || true)
          test -z "$deps" || { echo "root package pulled in non-stdlib deps:"; echo "$deps"; exit 1; }

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # Each test starts and stops the containers it needs, so there is no
      # stack to bring up here and nothing left behind if a test panics.
      - name: integration tier
        run: make test-integration
